<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />

  </head>
  <body>
    <main>

      <div id="DesktopView">

        <canvas id="desktopCnv"></canvas>

        <div id="Lane1" style="position: absolute">Lane 1</div>
        <div id="Lane2" style="position: absolute">Lane 2</div>
        <div id="Lane3" style="position: absolute">Lane 3</div>
        <div id="Lane4" style="position: absolute">Lane 4</div>
        <button id="Play" class="button-60">Play</button>
        <button id="Stop" class="button-60">Stop</button>
        <button id="Reset" class="button-60">Reset</button>

        <hr>

        <p style="font-weight: bold">Import Data</p>

        <select id="SelectRunData">
          <option>Select Run Data:</option>
          <option value="assets/data/SampleData/runData_JogSample.json">Jog Sample</option>
          <option value="assets/data/SampleData/runData_RunSample.json">Run Sample</option>
          <option value="assets/data/SampleData/runData_WalkSample.json">Walk Sample</option>
        </select>

        <select id ="PresetSelectDesktop">
          <option>Select Sound Preset:</option>
        </select>
        
        <p>Upload Local Run Data: 
        <input id="loadBttn" name="LOAD" required minlength="4" maxlength="8" size="10" type="file" />
        </p>
        
        <p>Global data...</p>
      </div>


      
    </main>
    <!--RESOURCES-->
    <script src="libs/p5.js"></script>

    <script src="libs/sound_engine/audio_system.js"></script>
    <script src="libs/sound_engine/es1_synth.js"></script>
    <script src="libs/sound_engine/app.js"></script>
    <script src="libs/sound_engine/sound_engine.js"></script>

    <!--SYSTEM-->
    <script src="src/sound_step_system/processors.js"></script>
    <script src="src/sound_step_system/session.js"></script>
    <script src="src/sound_step_system/simulator.js"></script>

    <!--PRESETS-->
    <script src="src/app/presets/presets.js"></script>
    <script src="src/app/presets/legacy_presets.js"></script>
    <script src="src/app/presets/preset_loader.js"></script>
    
    <!--APP-->
    <script src="src/app/local_request_handling.js"></script>
    <script src="src/app/sandbox/sandbox.js"></script>

  </body>
</html>
